name: Metrics
on:
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:
  push: {branches: ["main"]}
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update proof-of-work stats
        env:
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: node scripts/update-proof-of-work.mjs

      - name: Commit proof-of-work stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- assets/proof-of-work.svg; then
            git add assets/proof-of-work.svg
            git commit -m "Update proof-of-work.svg - [Skip GitHub Action]"
            git push
          else
            echo "No changes to proof-of-work.svg"
          fi

      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: gauravxsuvo
          template: classic
          config_display: large
          config_order: base.header, followup, base.activity+community, base.repositories
          extras_css: |
            svg {
              font-size: 12px;
              color: #c9d1d9;
            }
            h1 {
              font-size: 18px;
            }
            h2 {
              font-size: 15px;
            }
            h3 {
              font-size: 13px;
            }
            h1, h2, h3 {
              color: #58a6ff;
            }
            .items-wrapper {
              background-color: #0d1117;
              border: 2px solid #30363d;
              border-radius: 8px;
              padding: 16px;
              column-count: 2;
              column-gap: 24px;
            }
            .items-wrapper > section,
            .items-wrapper > div,
            .items-wrapper > footer {
              break-inside: avoid-column;
              -webkit-column-break-inside: avoid;
            }
            .items-wrapper > :not(.largeable-inline-flex) + .largeable.largeable-inline-flex {
              break-before: column;
              -webkit-column-break-before: always;
            }
            .largeable.largeable-inline-flex {
              width: 452px !important;
            }
            footer,
            .activity .details,
            .activity .timestamp,
            .repository .description,
            .repository .infos {
              color: #8b949e;
            }
            :root {
              --color-calendar-graph-day-bg: #161b22;
              --color-calendar-graph-day-border: rgba(240, 246, 252, 0.06);
            }
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Kolkata
          plugin_followup: yes
          plugin_followup_sections: repositories
          repositories: 1000
          repositories_forks: yes
